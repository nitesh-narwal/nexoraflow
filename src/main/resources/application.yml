spring:
  application:
    name: nexoraflow
  datasource:
    url: ${NEXORA_DB_URL:jdbc:postgresql://localhost:5432/nexoraflow}
    username: ${NEXORA_DB_USER:nexoraflow}
    password: ${NEXORA_DB_PASSWORD:nexoraflow_dev}
    hikari:
      maximum-pool-size: ${NEXORA_DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: false
        order_updates: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${NEXORA_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

nexoraflow:
  # Version of the deterministic business rules. Part of the reproducibility contract:
  # same seed + same configuration + same application version + same rule version => same logical dataset.
  business-rules-version: BR-1.0.0
  reporting-currency: USD
  generator:
    seed: 20261022
    size: MEDIUM              # SMALL (50 employees) | MEDIUM (400, default) | LARGE (2000)
    reference-date: 2026-10-22 # logical "today" of the synthetic company; never the wall clock
    output-dir: ${NEXORA_DATA_DIR:data}
    allow-reset: ${NEXORA_ALLOW_RESET:true}
    docs-dir: ${NEXORA_DOCS_DIR:docs}   # where the CLI writes docs/validation-report.md
  cli:
    # When set (e.g. --nexora.command=full-pipeline) the application runs the command and exits.
    command: ${NEXORA_COMMAND:}
